buildscript {
  ext.FullviewSdk = [
    kotlinVersion: "2.2.0",
    minSdkVersion: 27,          // floor of the bundled Fullview Android SDK
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }
    return FullviewSdk[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "com.fullviewsdk"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
  flatDir { dirs "libs" }
}

// ---------------------------------------------------------------------------
// The native Fullview Android SDK ships inside this package as an AAR (copied in
// by scripts/bundle-natives.sh). A local AAR carries no dependency metadata, so
// its runtime dependencies are declared here. Keep this list identical to
// android-sdk/gradle/libs.versions.toml in the monorepo; CI compares the two.
// ---------------------------------------------------------------------------
ext.fullviewNativeDeps = [
  "co.daily:client:0.40.0",
  "com.microsoft.signalr:signalr:10.0.12",
  "io.insert-koin:koin-core:4.0.4",
  "io.insert-koin:koin-android:4.0.4",
  "com.squareup.retrofit2:retrofit:2.11.0",
  "com.squareup.retrofit2:converter-gson:2.11.0",
  "com.squareup.retrofit2:converter-jackson:2.11.0",
  "com.squareup.okhttp3:logging-interceptor:4.12.0",
  "com.fasterxml.jackson.core:jackson-core:2.18.2",
  "com.fasterxml.jackson.core:jackson-annotations:2.18.2",
  "com.fasterxml.jackson.core:jackson-databind:2.18.2",
  "com.fasterxml.jackson.module:jackson-module-kotlin:2.18.2",
  "com.jakewharton.timber:timber:5.0.1",
  "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0",
  "io.reactivex.rxjava3:rxjava:3.1.10",
  "org.jetbrains.kotlin:kotlin-parcelize-runtime:2.2.0",
  "androidx.core:core-ktx:1.17.0",
  "androidx.appcompat:appcompat:1.7.1",
  "androidx.constraintlayout:constraintlayout:2.2.1",
  "androidx.activity:activity-ktx:1.10.1",
  "androidx.fragment:fragment-ktx:1.8.9",
  "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4",
  "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4",
  "com.google.android.material:material:1.13.0",
]

dependencies {
  implementation "com.facebook.react:react-android"

  implementation files("libs/fullview-sdk-release.aar")
  implementation platform("androidx.compose:compose-bom:2025.08.01")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.ui:ui-graphics"
  implementation "androidx.compose.ui:ui-unit"
  implementation "androidx.compose.foundation:foundation-layout"
  fullviewNativeDeps.each { dep -> implementation dep }
}
